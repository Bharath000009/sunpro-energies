<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunPro Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #D9440D 0%, #C13A0A 50%, #E8551E 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box img {
            width: 120px;
            margin-bottom: 10px;
        }
        .login-box h1 {
            color: #D9440D;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .login-box p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .login-box input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-box input:focus {
            border-color: #D9440D;
        }
        .login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #D9440D, #E8551E);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }
        .login-box button:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #C13A0A, #D9440D);
        }
        #error {
            color: #ff0000;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
        .lock-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #D9440D;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="lock-icon">🔐</div>
        <h1>☀️ SunPro Admin</h1>
        <p>Enter credentials to access dashboard</p>
        
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <input type="password" id="password" placeholder="Password" autocomplete="off">
        <button onclick="login()">Login to Dashboard</button>
        <p id="error">Invalid username or password</p>
        <a href="/" class="back-link">← Back to Website</a>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');
            
            if (!username || !password) {
                errorEl.textContent = 'Please enter username and password';
                errorEl.style.display = 'block';
                return;
            }
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.message || 'Invalid credentials';
                    errorEl.style.display = 'block';
                }
            } catch (error) {
                errorEl.textContent = 'Login failed. Please try again.';
                errorEl.style.display = 'block';
            }
        }

        // Submit on Enter key
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
