<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunPro Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { 
            color: #D9440D; 
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .refresh-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #D9440D, #E8551E);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(217,68,13,0.4);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .stat-card h3 { 
            color: #666; 
            font-size: 0.9rem; 
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card .number { 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #D9440D;
            margin-bottom: 5px;
        }
        .stat-card .subtitle {
            font-size: 0.85rem;
            color: #999;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: white;
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: #666;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #D9440D, #E8551E);
            color: white;
        }
        .data-table {
            width: 100%;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .data-table thead {
            background: linear-gradient(135deg, #D9440D, #C13A0A);
            color: white;
        }
        .data-table th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .data-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #f0f0f0;
            color: #333;
        }
        .data-table tbody tr:hover { 
            background: #fff5f0; 
        }
        .data-table tbody tr:last-child td {
            border-bottom: none;
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-new { background: #e3f2fd; color: #1976d2; }
        .status-pending { background: #fff3e0; color: #f57c00; }
        .stars {
            color: #FFD700;
            font-size: 1.1rem;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }
        .empty-state .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .phone-link {
            color: #D9440D;
            text-decoration: none;
            font-weight: 600;
        }
        .phone-link:hover { text-decoration: underline; }
        
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 15px; text-align: center; }
            .data-table { font-size: 0.85rem; }
            .data-table th, .data-table td { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☀️ SunPro Energies Dashboard</h1>
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon">📋</div>
                <h3>Total Quotes</h3>
                <div class="number" id="totalQuotes">0</div>
                <div class="subtitle" id="todayQuotes"></div>
            </div>
            <div class="stat-card">
                <div class="icon">⭐</div>
                <h3>Total Reviews</h3>
                <div class="number" id="totalReviews">0</div>
                <div class="subtitle" id="avgRating"></div>
            </div>
            <div class="stat-card">
                <div class="icon">📞</div>
                <h3>Latest Enquiry</h3>
                <div class="number" style="font-size: 1.2rem;" id="latestEnquiry">-</div>
                <div class="subtitle" id="latestTime"></div>
            </div>
            <div class="stat-card">
                <div class="icon">🏢</div>
                <h3>Popular Service</h3>
                <div class="number" style="font-size: 1.2rem;" id="popularService">-</div>
                <div class="subtitle">Most requested</div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('quotes')">📋 Quotes</button>
            <button class="tab-btn" onclick="showTab('reviews')">⭐ Reviews</button>
        </div>

        <div id="quotesTab">
            <div class="data-table">
                <table style="width: 100%;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Service</th>
                            <th>Capacity</th>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="quotesTableBody">
                        <tr>
                            <td colspan="8">
                                <div class="empty-state">
                                    <div class="emoji">📋</div>
                                    <p>Loading quotes...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="reviewsTab" style="display:none;">
            <div class="data-table">
                <table style="width: 100%;">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>City</th>
                            <th>Service</th>
                            <th>Rating</th>
                            <th>Review</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="reviewsTableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="emoji">⭐</div>
                                    <p>Loading reviews...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let quotesData = [];
        let reviewsData = [];

        async function loadData() {
            try {
                // Show loading state
                document.getElementById('quotesTableBody').innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="emoji">⏳</div><p>Loading...</p></div></td></tr>';
                document.getElementById('reviewsTableBody').innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="emoji">⏳</div><p>Loading...</p></div></td></tr>';

                const [quotesRes, reviewsRes, statsRes] = await Promise.all([
                    fetch('/api/quotes/all').catch(err => ({ ok: false })),
                    fetch('/api/reviews/all').catch(err => ({ ok: false })),
                    fetch('/api/stats').catch(err => ({ ok: false }))
                ]);

                let quotes = { success: false, data: [] };
                let reviews = { success: false, data: [] };
                let stats = { success: false, data: {} };

                if (quotesRes.ok) quotes = await quotesRes.json();
                if (reviewsRes.ok) reviews = await reviewsRes.json();
                if (statsRes.ok) stats = await statsRes.json();

                quotesData = quotes.data || [];
                reviewsData = reviews.data || [];

                // Update stats
                updateStats(stats.data || {});
                
                // Update tables
                updateQuotesTable();
                updateReviewsTable();

                console.log('✅ Dashboard updated:', { 
                    quotes: quotesData.length, 
                    reviews: reviewsData.length 
                });

            } catch (error) {
                console.error('❌ Error loading dashboard:', error);
                document.getElementById('quotesTableBody').innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="emoji">❌</div><p>Error loading data. Check console.</p></div></td></tr>';
            }
        }

        function updateStats(stats) {
            document.getElementById('totalQuotes').textContent = stats.totalQuotes || 0;
            document.getElementById('todayQuotes').textContent = `Today: ${stats.todayQuotes || 0}`;
            document.getElementById('totalReviews').textContent = stats.totalReviews || 0;
            document.getElementById('avgRating').textContent = `Avg Rating: ${stats.averageRating || 0} ⭐`;
            
            // Latest enquiry
            if (quotesData.length > 0) {
                const latest = quotesData[0];
                document.getElementById('latestEnquiry').textContent = latest.name || '-';
                document.getElementById('latestTime').textContent = new Date(latest.createdAt).toLocaleString('en-IN');
            }
            
            // Popular service
            if (quotesData.length > 0) {
                const services = {};
                quotesData.forEach(q => {
                    services[q.serviceType] = (services[q.serviceType] || 0) + 1;
                });
                const popular = Object.entries(services).sort((a, b) => b[1] - a[1])[0];
                document.getElementById('popularService').textContent = popular ? popular[0] : '-';
            }
        }

        function updateQuotesTable() {
            const tbody = document.getElementById('quotesTableBody');
            
            if (quotesData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="emoji">📋</div><p>No quotes yet</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = quotesData.map((q, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${q.name}</strong></td>
                    <td><a href="tel:${q.phone}" class="phone-link">${q.phone}</a></td>
                    <td>${q.city}</td>
                    <td>${q.serviceType}</td>
                    <td>${q.systemCapacity || '-'}</td>
                    <td>${new Date(q.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                    <td><span class="status-badge status-${q.status || 'new'}">${q.status || 'new'}</span></td>
                </tr>
            `).join('');
        }

        function updateReviewsTable() {
            const tbody = document.getElementById('reviewsTableBody');
            
            if (reviewsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="emoji">⭐</div><p>No reviews yet</p></div></td></tr>';
                return;
            }

            tbody.innerHTML = reviewsData.map((r, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${r.name}</strong></td>
                    <td>${r.city}</td>
                    <td>${r.service}</td>
                    <td><span class="stars">${'⭐'.repeat(r.rating)}</span></td>
                    <td>${r.review.length > 100 ? r.review.substring(0, 100) + '...' : r.review}</td>
                    <td>${new Date(r.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</td>
                </tr>
            `).join('');
        }

        function showTab(tab) {
            document.getElementById('quotesTab').style.display = tab === 'quotes' ? 'block' : 'none';
            document.getElementById('reviewsTab').style.display = tab === 'reviews' ? 'block' : 'none';
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Load data on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);

        // Add keyboard shortcut for refresh (Ctrl+R)
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                loadData();
            }
        });
    </script>
</body>
</html>
